- test: riscv_rand_instr_test
  description: >
    Random instruction stress test with mixed hazards and branches
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=5
    +gen_all_csrs_by_default=1
    +add_csr_write=MSTATUS,MEPC,MCAUSE,MTVAL,0x7c0,0x7c1
    +no_csr_instr=0
  iterations: 1
  isa: rv32imc
  gen_test: riscv_instr_base_test
  rtl_test: ibex_core_base_test

