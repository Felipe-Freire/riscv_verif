- test: riscv_lsu_hazard_stress_test
  description: >
    Test focused on overwhelming a load/store unit (LSU). Combines unaligned accesses,
    data conflicts (hazards), and load/store bursts. Excellent for RTL coverage.
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=3
    +enable_unaligned_load_store=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,30
    +directed_instr_1=riscv_load_store_hazard_instr_stream,30
    +directed_instr_2=riscv_hazard_instr_stream,30
  iterations: 1
  isa: rv32imc
  gen_test: riscv_instr_base_test
  rtl_test: ibex_core_base_test

