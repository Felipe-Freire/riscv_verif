- test: riscv_user_mode_rand_test
  description: >
    Booting and running in User Mode (boot_mode=u) triggers privilege checks inside cs_registers_i and controller_i.
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=5
    +boot_mode=u
    +no_csr_instr=0
    +supported_privileged_mode=3
  iterations: 1
  isa: rv32imc
  gen_test: riscv_instr_base_test
  rtl_test: ibex_core_base_test

- test: riscv_umode_tw_test
  description: >
    Specifically targets mstatus.tw (Timeout Wait). Booting in U-mode and executing wfi forces a trap to M-mode via illegal instruction exception.
  gen_opts: >
    +instr_cnt=10000
    +set_mstatus_tw=1
    +boot_mode=u
    +no_wfi=0
    +no_ebreak=1
    +supported_privileged_mode=3
  iterations: 1
  isa: rv32imc
  gen_test: riscv_rand_instr_test
  rtl_test: ibex_core_base_test

